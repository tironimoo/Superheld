name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the APK as a GitHub release"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Using the release keystore from repository secrets."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set - falling back to the debug key. The APK installs, but its signature changes between builds, so a later update cannot be installed over it."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ueberheld.apk

      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs ueberheld.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ueberheld-apk
          path: ueberheld.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v1.0.${{ github.run_number }}"
          gh release create "$TAG" ueberheld.apk \
            --title "Überheld App 1.0.${{ github.run_number }}" \
            --notes "Android-App zum Seitwärts-Installieren.

          Lade \`ueberheld.apk\` direkt auf dem Android-Gerät herunter und öffne sie. Dafür muss die Installation aus unbekannten Quellen kurzzeitig erlaubt sein.

          Die App ist eine Hülle um https://tironimoo.github.io/Superheld/ — Spiel-Updates kommen automatisch beim Start, ein neues APK ist dafür nicht nötig."
