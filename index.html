<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0b3d">
<meta name="description" content="Überheld – steuere deinen Helden in der Ego-Perspektive durch eine magische Welt!">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Überheld – Ego-Abenteuer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="starfield" aria-hidden="true"></div>

<div id="app">

  <!-- ===== HELDEN-ERSTELLUNG ===== -->
  <section id="screen-create" class="screen">
    <div class="panel intro-panel">
      <h1 class="game-title">✨ ÜBERHELD ✨</h1>
      <p class="subtitle">Erschaffe deinen Helden und erlebe dein Abenteuer hautnah in der Ich-Perspektive!</p>

      <label class="field-label" for="hero-name">Wie heißt dein Held?</label>
      <input id="hero-name" class="hero-input" type="text" maxlength="14" placeholder="z. B. Blitzstern" autocomplete="off">

      <p class="field-label">Wähle dein Helden-Erscheinungsbild:</p>
      <div id="skin-picker" class="skin-picker"></div>

      <button id="btn-start-game" class="btn btn-primary btn-big">🚀 Abenteuer beginnen!</button>
    </div>
  </section>

  <!-- ===== 3D EGO-WELT ===== -->
  <section id="screen-world" class="screen hidden">
    <canvas id="game-canvas"></canvas>

    <div id="crosshair" aria-hidden="true"></div>

    <header class="world-hud-top">
      <div class="hero-badge small"><div id="hud-avatar" class="hero-avatar"></div></div>
      <div class="hero-info">
        <span id="hud-hero-name" class="hero-name"></span>
        <div class="rank-row"><span id="hud-rank-title" class="rank-title"></span></div>
        <div class="rank-bar-track"><div id="hud-rank-bar" class="rank-bar-fill"></div></div>
        <div id="hud-hearts" class="hearts-row"></div>
      </div>
      <div class="stars-counter small"><span class="star-icon">⭐</span><span id="hud-stars">0</span></div>
      <button id="btn-pause" class="icon-btn" title="Menü">☰</button>
    </header>

    <div id="damage-flash" aria-hidden="true"></div>
    <div id="toast-layer" aria-hidden="true"></div>

    <div id="joystick-base" class="joystick-base">
      <div id="joystick-knob" class="joystick-knob"></div>
    </div>
    <button id="btn-jump" class="jump-btn" title="Springen">⬆️</button>

    <div id="power-select-row" class="power-select-row"></div>
    <div class="cast-wrap">
      <svg class="charge-ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="charge-ring-bg" cx="50" cy="50" r="44"></circle>
        <circle id="charge-ring-fill" class="charge-ring-fill" cx="50" cy="50" r="44"></circle>
      </svg>
      <button id="btn-cast" class="cast-btn">🔥</button>
    </div>
  </section>

  <!-- ===== PAUSE-MENÜ ===== -->
  <div id="screen-pause" class="pause-overlay hidden">
    <div class="panel pause-panel">
      <h2 class="pause-title">⏸ Pause</h2>
      <button id="btn-resume" class="btn btn-primary btn-big">▶ Weiter spielen</button>
      <button id="btn-pause-powers" class="btn btn-secondary btn-big">🦸 Kräfte</button>
      <button id="btn-pause-achievements" class="btn btn-secondary btn-big">🏆 Erfolge</button>
      <button id="btn-sound" class="btn btn-secondary btn-big">🔊 Ton an</button>
    </div>
  </div>

  <!-- ===== KRÄFTE ===== -->
  <section id="screen-powers" class="screen hidden">
    <header class="sub-header">
      <button class="btn-back" data-back="pause">← Zurück</button>
      <h2>Deine Superkräfte</h2>
      <div class="stars-counter small"><span class="star-icon">⭐</span><span id="stars-count-2">0</span></div>
    </header>
    <div id="powers-grid" class="powers-grid"></div>
  </section>

  <!-- ===== ERFOLGE ===== -->
  <section id="screen-achievements" class="screen hidden">
    <header class="sub-header">
      <button class="btn-back" data-back="pause">← Zurück</button>
      <h2>Erfolge</h2>
      <div></div>
    </header>
    <div id="achievements-grid" class="achievements-grid"></div>
  </section>

  <!-- ===== BELOHNUNG / RANG-AUFSTIEG OVERLAY ===== -->
  <div id="overlay" class="overlay hidden">
    <div class="overlay-panel" id="overlay-panel"></div>
  </div>

  <canvas id="confetti-canvas"></canvas>
</div>

<script src="state.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<script type="module" src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
